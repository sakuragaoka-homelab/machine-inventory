# Dependabot keeps pinned actions and declared dependencies current. Minor and
# patch updates are grouped per ecosystem and merge automatically once every
# check on the exact head commit passes. Major updates open their own pull
# request, carry the `major-update` label, and wait for owner review.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(actions)"
